            document.getElementById('section-more').innerText = data.more;
            
            // 渲染作者简介（侧边栏）
            document.getElementById('about-content').innerHTML = data.aboutShortHtml;

            // 渲染精选文章
            const featuredContainer = document.getElementById('featured-container');
            featuredContainer.innerHTML = '';
            articlesData.forEach(art => {
                if (art.hasAbstract) {
                    const div = document.createElement('div');
                    div.className = 'featured-article';
                    const tag = currentLang === 'zh' ? art.zhTag : art.enTag;
                    div.innerHTML = `
                        <span class="article-tag" onclick="showCategoryPage('${tag}')">${tag}</span>
                        <h3>${currentLang === 'zh' ? art.zhTitle : art.enTitle}</h3>
                        <p><strong>${data.abstract}:</strong> ${currentLang === 'zh' ? art.zhAbstract : art.enAbstract}</p>
                        ${art.link ? `<a href="${art.link}" target="_blank" class="read-more">${data.readMore}</a>` : ''}
                    `;
                    featuredContainer.appendChild(div);
                }
            });

            // 渲染分类标签按钮
            const tagsContainer = document.getElementById('tags-container');
            tagsContainer.innerHTML = '';
            const uniqueTags = getUniqueTags(currentLang);
            uniqueTags.forEach(tag => {
                const button = document.createElement('button');
                button.className = 'category-tag';
                button.innerText = tag;
                button.onclick = () => showCategoryPage(tag);
                tagsContainer.appendChild(button);
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            render();
            window.scrollTo(0, 0);
        }

        // 初始化渲染
        window.onload = render;
    </script>
</body>
</html>
