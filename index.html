            }
        };

        let currentLang = 'zh';

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            renderPage();
        }

        function renderPage() {
            // 更新静态文本
            document.getElementById('page-title').innerText = currentLang === 'zh' ? '李娟博士科学传播作品集' : 'Dr. Juan Li\'s Science Portfolio';
            document.getElementById('page-subtitle').innerText = currentLang === 'zh' ? '专注生物医学和健康政策前沿' : 'Focusing on Biomedical Frontiers & Health Policy';
            document.getElementById('langBtn').innerText = currentLang === 'zh' ? 'English Version' : '中文版';
            document.getElementById('section-featured').innerText = currentLang === 'zh' ? '精选文章' : 'Featured Articles';
            document.getElementById('section-more').innerText = currentLang === 'zh' ? '更多文章' : 'More Articles';
            document.getElementById('footer-text').innerHTML = currentLang === 'zh' ? '&copy; 2026 Juan Li 博士 / All Rights Reserved' : '&copy; 2026 Dr. Juan Li / All Rights Reserved';

            // 更新作者简介
            const about = aboutData[currentLang];
            document.getElementById('about-content').innerHTML = `
                <h2>${about.title}</h2>
                <p>${about.intro}</p>
                <a href="javascript:void(0)" class="more-about-btn" onclick="showAboutFull()">${currentLang === 'zh' ? '了解更多' : 'Learn More'}</a>
            `;
            document.getElementById('full-about-title').innerText = currentLang === 'zh' ? '作者简介（完整）' : 'About the Author (Full)';
            document.getElementById('full-about-content').innerHTML = about.full;

            // 更新精选文章 (前3篇)
            const featuredContainer = document.getElementById('featured-container');
            featuredContainer.innerHTML = '';
            articlesData.slice(0, 3).forEach(article => {
                const div = document.createElement('div');
                div.className = 'featured-article';
                div.innerHTML = `
                    <span class="article-tag">${currentLang === 'zh' ? article.zhTag : article.enTag}</span>
                    <h3>${currentLang === 'zh' ? article.zhTitle : article.enTitle}</h3>
                    <p>${currentLang === 'zh' ? article.zhAbstract : article.enAbstract}</p>
                    <a href="${article.link}" target="_blank" class="read-more">${currentLang === 'zh' ? '阅读全文' : 'Read Full Article'}</a>
                `;
                featuredContainer.appendChild(div);
            });

            // 更新标签分类
            const tagsContainer = document.getElementById('tags-container');
            tagsContainer.innerHTML = '';
            const tags = [...new Set(articlesData.map(a => currentLang === 'zh' ? a.zhTag : a.enTag))];
            tags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'category-tag';
                btn.innerText = tag;
                btn.onclick = () => showCategory(tag);
                tagsContainer.appendChild(btn);
            });
        }

        function showCategory(tag) {
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('about-full-page').style.display = 'none';
            document.getElementById('category-page').style.display = 'block';
            
            document.getElementById('category-title').innerText = (currentLang === 'zh' ? '文章分类：' : 'Category: ') + tag;
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            
            const filtered = articlesData.filter(a => (currentLang === 'zh' ? a.zhTag : a.enTag) === tag);
            filtered.forEach(article => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <a href="${article.link}" target="_blank">${currentLang === 'zh' ? article.zhTitle : article.enTitle}</a>
                    <span class="article-meta">${currentLang === 'zh' ? '阅读全文' : 'Read More'}</span>
                `;
                list.appendChild(li);
            });
            window.scrollTo(0, 0);
        }

        function showAboutFull() {
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('category-page').style.display = 'none';
            document.getElementById('about-full-page').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function showMainPage() {
            document.getElementById('category-page').style.display = 'none';
            document.getElementById('about-full-page').style.display = 'none';
            document.getElementById('main-page').style.display = 'block';
            window.scrollTo(0, 0);
        }

        // 初始化
        renderPage();
    </script>
</body>
</html>
