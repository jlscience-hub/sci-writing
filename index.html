        const aboutData = {
            "zh": {
                "title": "作者介绍",
                "intro": "李娟博士拥有生命科学专业博士学位，曾在中国、美国及加拿大从事生物医学基础研究，在国际期刊发表学术论文多篇。她同时深耕科学传播领域，擅长文献综述、证据综合及面向多元受众的科研写作，能将复杂医学研究转化为清晰易懂的内容。",
                "full": `
                    <h3>个人简介</h3>
                    <p>李娟博士是一位兼具深厚科研背景与丰富科学传播经验的生命科学学者。</p>
                    <p>她曾在中国、美国及加拿大顶尖科研院所从事生物医学基础研究，在国际同行评审期刊发表学术论文多篇。</p>
                    <p>在科学传播领域，她联合创办了一家专注于健康科普的科技媒体机构，担任主编数年，带领团队为研究人员、临床医生及公众制作基于证据的科普文章、可视化内容与教育素材，并与学术期刊及科研机构建立合作关系。她还主持了中国科学技术协会及中国科学院资助的多项科学传播项目。最近几年，她以独立科学传播写作顾问身份持续活跃于该领域，服务于多元受众群体，包括学术界、医疗界及政策制定者。</p>
                    <p>李博士的核心专长涵盖系统文献综述与证据综合、研究类写作与知识转化、跨学科团队协作，以及生物医学实验室研究等。</p>
                `
            },
            "en": {
                "title": "About the Author",
                "intro": "Dr. Juan Li holds a PhD in Developmental Biology and Immunology and has conducted biomedical research in China, the United States, and Canada, with multiple publications in international peer-reviewed journals. She has also built a distinguished career in science communication, specializing in literature review, evidence synthesis, and research writing for academic, clinical, policy, and public audiences.",
                "full": `
                    <h3>About Dr. Li</h3>
                    <p>Dr. Juan Li is a life scientist and science communicator with a strong foundation in biomedical research and extensive experience in evidence-based science writing. </p>
                    <p>Dr. Li held research positions at top-tier university and institutes across China,US and Canada, where she conducted fundamental biomedical research and published multiple articles in international peer-reviewed journals.</p>
                    <p>Dr. Li subsequently transitioned into science communication, co-founding a healthcare science media company where she served as Chief Editor for over six years. In this role, she led a team in producing evidence-based articles, visual content, and educational materials for researchers, clinicians, and the general public, while building collaborative partnerships with academic journals and research institutions. She also directed science communication projects funded by the China Association for Science and Technology and the Chinese Academy of Sciences. In recent years, she has continued to work as an independent science communication consultant, serving diverse audiences that include academic researchers, healthcare professionals, and policy stakeholders.</p>
                    <p>Dr. Li's core expertise encompasses systematic literature review and evidence synthesis, research writing and knowledge translation, multidisciplinary collaboration, and biomedical laboratory research.</p>
                `
            }
        };

        let currentLang = 'zh';

        // 语言切换函数
        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            renderPage();
        }

        // 渲染整个页面
        function renderPage() {
            // 更新静态文本
            document.getElementById('page-title').innerText = currentLang === 'zh' ? '李娟博士科学传播作品集' : 'Dr. Juan Li\'s Science Portfolio';
            document.getElementById('page-subtitle').innerText = currentLang === 'zh' ? '专注生物医学和健康政策前沿' : 'Focusing on Biomedical Frontiers & Health Policy';
            document.getElementById('langBtn').innerText = currentLang === 'zh' ? 'English Version' : '中文版';
            document.getElementById('section-featured').innerText = currentLang === 'zh' ? '精选文章' : 'Featured Articles';
            document.getElementById('additional-works-title').innerText = currentLang === 'zh' ? '更多作品' : 'More Works';
            document.getElementById('footer-text').innerHTML = currentLang === 'zh' ? '&copy; 2026 Juan Li 博士 / All Rights Reserved' : '&copy; 2026 Dr. Juan Li / All Rights Reserved';

            // 更新作者简介和合作媒体侧边栏
            renderAuthorSidebar();
            
            // 更新标签分类
            renderCategoryTags();
            
            // 渲染完整文章列表
            renderFullArticlesList();
            
            // 渲染更多作品列表
            renderAdditionalWorks();
            
            // 更新完整介绍页面
            const about = aboutData[currentLang];
            document.getElementById('full-about-title').innerText = currentLang === 'zh' ? '作者简介（完整）' : 'About the Author (Full)';
            document.getElementById('full-about-content').innerHTML = about.full;
        }

        // 渲染作者侧边栏（包含合作媒体）
        function renderAuthorSidebar() {
            const about = aboutData[currentLang];
            
            // 获取所有媒体平台
            const allMedia = [...new Set([
                ...articlesData.map(a => a.media),
                ...additionalWorksData.map(w => w.media)
            ])].filter(Boolean).sort();
            
            document.getElementById('about-content').innerHTML = `
                <h2>${about.title}</h2>
                <p>${about.intro}</p>
                <a href="javascript:void(0)" class="more-about-btn" onclick="showAboutFull()">${currentLang === 'zh' ? '详细介绍' : 'Detailed Introduction'}</a>
                
                <!-- 侧边栏：合作媒体 -->
                <div class="sidebar-tags">
                    <h3>${currentLang === 'zh' ? '合作媒体' : 'Media Partners'}</h3>
                    ${allMedia.map(media => `<span class="sidebar-tag" onclick="showMedia('${media}')">${media}</span>`).join('')}
                </div>
            `;
        }

        // 渲染分类标签
        function renderCategoryTags() {
            const tagsContainer = document.getElementById('tags-container');
            tagsContainer.innerHTML = '';
            
            // 获取所有分类标签
            const mainTags = articlesData.map(a => currentLang === 'zh' ? a.zhTag : a.enTag);
            const additionalTags = additionalWorksData.map(w => currentLang === 'zh' ? w.zhTag : w.enTag);
            let allTags = [...new Set([...mainTags, ...additionalTags])];
            
            // 添加“人物采访”标签
            const interviewTag = currentLang === 'zh' ? '人物采访' : 'Interviews';
            if (!allTags.includes(interviewTag)) {
                allTags.push(interviewTag);
            }
            
            allTags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'category-tag';
                btn.innerText = tag;
                btn.onclick = () => showCategory(tag);
                tagsContainer.appendChild(btn);
            });
        }

        // 渲染完整文章列表
        function renderFullArticlesList() {
            const container = document.getElementById('full-articles-container');
            container.innerHTML = '';
            
            const sortedArticles = [...articlesData].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            sortedArticles.forEach(article => {
                const card = document.createElement('div');
                card.className = 'article-card';
                
                // 检查是否属于人物采访
                const isInterview = article.isInterview || false;
                const interviewTag = currentLang === 'zh' ? '人物采访' : 'Interviews';
                const mainTag = currentLang === 'zh' ? article.zhTag : article.enTag;
                
                card.innerHTML = `
                    <span class="article-tag" onclick="showCategory('${mainTag}')">${mainTag}</span>
                    ${isInterview ? `<span class="article-tag" onclick="showCategory('${interviewTag}')">${interviewTag}</span>` : ''}
                    <h4>${currentLang === 'zh' ? article.zhTitle : article.enTitle}</h4>
                    <div class="abstract">${currentLang === 'zh' ? article.zhAbstract : article.enAbstract}</div>
                    <a href="${article.link}" target="_blank" class="read-more">${currentLang === 'zh' ? '阅读全文' : 'Read Full Article'}</a>
                    <div class="meta-info">${article.date} | ${article.media}</div>
                `;
                container.appendChild(card);
            });
        }

        // 渲染更多作品列表
        function renderAdditionalWorks() {
            const listContainer = document.getElementById('additional-works-list');
            listContainer.innerHTML = '';
            
            additionalWorksData.forEach(work => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="work-title">${currentLang === 'zh' ? work.zhTitle : work.enTitle}</span>
                    <span class="work-source">${work.source}</span>
                `;
                listContainer.appendChild(li);
            });
        }

        // 显示分类页面
        function showCategory(tag) {
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('about-full-page').style.display = 'none';
            document.getElementById('category-page').style.display = 'block';
            
            document.getElementById('category-title').innerText = (currentLang === 'zh' ? '文章分类：' : 'Category: ') + tag;
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            
            const interviewTagZh = '人物采访';
            const interviewTagEn = 'Interviews';
            
            let filteredMain, filteredAdditional;
            
            if (tag === interviewTagZh || tag === interviewTagEn) {
                filteredMain = articlesData.filter(a => a.isInterview);
                filteredAdditional = additionalWorksData.filter(w => w.isInterview);
            } else {
                filteredMain = articlesData.filter(a => (currentLang === 'zh' ? a.zhTag : a.enTag) === tag);
                filteredAdditional = additionalWorksData.filter(w => (currentLang === 'zh' ? w.zhTag : w.enTag) === tag);
            }
            
            const mainItems = filteredMain.map(article => ({
                title: currentLang === 'zh' ? article.zhTitle : article.enTitle,
                link: article.link,
                date: article.date || ''
            }));
            
            const additionalItems = filteredAdditional.map(work => {
                const dateMatch = work.source.match(/(\d{4}-\d{2}-\d{2})/);
                const date = dateMatch ? dateMatch[1] : '';
                return {
                    title: currentLang === 'zh' ? work.zhTitle : work.enTitle,
                    link: '#',
                    date: date
                };
            });
            
            const allItems = [...mainItems, ...additionalItems];
            allItems.sort((a, b) => (b.date && a.date) ? new Date(b.date) - new Date(a.date) : 0);
            
            allItems.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <a href="${item.link}" ${item.link !== '#' ? 'target="_blank"' : ''}>${item.title}</a>
                    ${item.date ? `<span class="article-meta">${item.date}</span>` : ''}
                `;
                list.appendChild(li);
            });
            
            window.scrollTo(0, 0);
        }

        // 显示媒体平台文章
        function showMedia(mediaName) {
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('about-full-page').style.display = 'none';
            document.getElementById('category-page').style.display = 'block';
            
            document.getElementById('category-title').innerText = (currentLang === 'zh' ? '媒体平台：' : 'Media: ') + mediaName;
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            
            const filteredMain = articlesData.filter(a => a.media === mediaName);
            const filteredAdditional = additionalWorksData.filter(w => w.media === mediaName);
            
            const mainItems = filteredMain.map(article => ({
                title: currentLang === 'zh' ? article.zhTitle : article.enTitle,
                link: article.link,
                date: article.date || ''
            }));
            
            const additionalItems = filteredAdditional.map(work => {
                const dateMatch = work.source.match(/(\d{4}-\d{2}-\d{2})/);
                const date = dateMatch ? dateMatch[1] : '';
                return {
                    title: currentLang === 'zh' ? work.zhTitle : work.enTitle,
                    link: '#',
                    date: date
                };
            });
            
            const allItems = [...mainItems, ...additionalItems];
            allItems.sort((a, b) => (b.date && a.date) ? new Date(b.date) - new Date(a.date) : 0);
            
            allItems.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <a href="${item.link}" ${item.link !== '#' ? 'target="_blank"' : ''}>${item.title}</a>
                    ${item.date ? `<span class="article-meta">${item.date}</span>` : ''}
                `;
                list.appendChild(li);
            });
            
            window.scrollTo(0, 0);
        }

        // 显示完整介绍页面
        function showAboutFull() {
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('category-page').style.display = 'none';
            document.getElementById('about-full-page').style.display = 'block';
            window.scrollTo(0, 0);
        }

        // 返回主页面
        function showMainPage() {
            document.getElementById('category-page').style.display = 'none';
            document.getElementById('about-full-page').style.display = 'none';
            document.getElementById('main-page').style.display = 'grid';
            window.scrollTo(0, 0);
        }

        // 初始化页面
        renderPage();
    </script>
</body>
</html>
